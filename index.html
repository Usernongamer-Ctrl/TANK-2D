else if(r.a==='bomb')for(let i=0;i<3;i++){const bx=60+Math.random()*840,by=60+Math.random()*520;boom(bx,by,50);G.tanks.forEach(t=>{if(!t.dead&&Math.hypot(t.x-bx,t.y-by)<60){t.hp-=x;if(t.hp<=0){t.dead=1;t.hp=0;t.lives--;if(t.lives>0)t.rs=3;boom(t.x,t.y,t.r*2)}}})}}
const scriptLab=()=>`<h3>Script lab ${LC()>=8?'':'🔒 needs level 8 or the Creator gift code'}</h3><fieldset ${LC()>=8?'':'disabled'} style="border:1px solid var(--bd);border-radius:8px"><p class="s">One rule per line: <code>on start | on kill | on death | every N : action args</code>. Actions: msg TEXT, heal %, hurt %, credits N (max 2000 per match), spawn TEAM COUNT, score TEAM POINTS, time SECONDS, speed MULT, bomb DAMAGE. Lines starting with # are ignored. Turn it on with "Run my script" in a Custom Lobby.</p><textarea id="sc" rows="7" style="width:100%;font-family:monospace">${SCR.replace(/</g,'&lt;')}</textarea><div class="row"><button class="b on" onclick="SCR=$('#sc').value;save();garage()">Save script</button>${Object.keys(EX).map(k=>`<button class="b" onclick="$('#sc').value=EX['${k}']">Example: ${k}</button>`).join('')}<span class="s">${parseScr(SCR).length} rules saved</span></div></fieldset>`;
const kn=c=>c.replace('Key','').replace('Numpad','Num ').replace('Arrow','Arrow ');
function settings(){const np=cheat?4:2,on=(p,a)=>bind&&bind[0]==p&&bind[1]==a;show(`<button class="b" onclick="main()">← Back</button><h2>Settings</h2><h3>Controls <span class="s">tank style: forward/back + turn. Click an action, then press the new key.</span></h3>${Array.from({length:np},(_,i)=>'p'+(i+1)).map(p=>`<div class="row"><b>${p.toUpperCase()}</b>${[['f','Forward'],['b','Back'],['l','Turn left'],['r','Turn right'],['s','Fire']].concat(KB[p].s2?[['s2','Fire 2']]:[]).map(a=>`<button class="b ${on(p,a[0])?'on':''}" onclick="bind=['${p}','${a[0]}'];settings()">${a[1]}: ${on(p,a[0])?'press a key…':kn(KB[p][a[0]])}</button>`).join('')}</div>`).join('')}<div class="row"><button class="b" onclick="Object.assign(KB,DKB());bind=null;save();settings()">Reset controls</button></div><h3>Teams</h3><div class="row">Number of teams <select onchange="S.nt=+this.value;save();settings()">${[2,3,4].map(n=>`<option value="${n}" ${S.nt==n?'selected':''} ${n>maxT()?'disabled':''}>${n}${n>maxT()?' 🔒':''}</option>`).join('')}</select><span class="s">3 teams need level 3, 4 teams level 6. Official lobbies always use 2 teams.</span></div>${[0,1,2,3].map(i=>`<div class="row">Team ${i+1} <input type="text" value="${S.tn[i]}" oninput="S.tn[${i}]=this.value.toUpperCase();save()"> <input type="color" value="${TC[i]}" oninput="TC[${i}]=this.value;save()"></div>`).join('')}<h3>Gift code</h3><div class="row"><input type="text" id="gc" placeholder="Enter code"><button class="b on" onclick="redeem()">Redeem</button> <b id="gm">${cheat?'★ Master gift code active':''}</b></div>`)}
function redeem(){const c=$('#gc').value.trim().toUpperCase(),m=$('#gm');if(c==='TANKMASTER'){cheat=1;LV=99;save();m.textContent='★ Unlocked: custom lobby, special tanks, up to 4 players, 4 teams and every option!'}else if(c==='CREATORPASS'){gA=1;save();m.textContent='★ Creator pass: tank builder, full mod editor and script lab unlocked!'}else if(c==='MOREOPTIONS'){gB=1;save();m.textContent='★ More options: every lobby rule, themes and extras unlocked!'}else if(c==='RICHTANK'){C+=10000;save();m.textContent='+💰10000 credits'}else if(c==='NOCHEAT'){cheat=0;gA=gB=0;S.k1=6;S.k2=S.k3=S.k4=0;chk();save();m.textContent='Gift unlocks removed.'}else m.textContent='Invalid code'}
const mn=n=>{mnote=n.length?'🎖 Mission complete: '+n.join(', ')+' — level up!':''};
function missions(){const n=chk();show(`<button class="b" onclick="main()">← Back</button><h2>Missions — Level ${LV}</h2><p class="s">Each completed mission gives +1 level and 💰300.${n.length?' <b>Just completed: '+n.join(', ')+'</b>':''}</p>${MS.map((m,i)=>`<div class="row">${done.includes(i)?'✅':'⬜'} ${m[0]}</div>`).join('')}<h3>Unlocks by level</h3><p class="s">L2 Custom Lobby, 5v5, tank builder, time and kill limits · L3 Hard bots, lives, paint shop · L4 Blitz 7v7, mod editor (stats), damage and HP multipliers · L5 Elite bots, speed and reload multipliers · L6 bullet speed, bot HP, mod bullet/turn/size · L7 friendly fire, brick toggle · L6 also bullet range · L7 also credit reward · L8 multi-shot mods, team size offset, ricochet bullets, script lab · L9 HP regen, heal on kill · L10 tank size, bot speed. Gift codes can unlock creator features or lobby options early. Team size cap grows with level. Mod stat caps rise with level.</p>`)}
main();
</script></body></html>
